<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flashcards</title>
<style>
:root {
  --bg: #0f1115; --panel: #171a21; --panel-2: #1f232c; --text: #e8e9ed;
  --muted: #8a8f9c; --accent: #6c8cff; --good: #4caf7d; --hard: #e0a835;
  --again: #e05a5a; --easy: #4c9fe0; --radius: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid #262a33; }
header h1 { margin: 0; font-size: 1.4rem; cursor: pointer; }
.header-actions { display: flex; align-items: center; gap: 10px; }
button { background: var(--panel-2); color: var(--text); border: 1px solid #2b303b; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-size: 0.95rem; }
button:hover { background: #262b35; }
button.primary { background: var(--accent); border-color: var(--accent); color: #0f1115; font-weight: 600; }
button.primary:hover { opacity: 0.9; }
button.danger { color: var(--again); }
button.backup { background: #2c313c; border-color: #3e4451; }
main { max-width: 900px; margin: 0 auto; padding: 24px 32px 60px; }
.hidden { display: none !important; }
.row { display: flex; gap: 10px; margin-bottom: 24px; }
.backup-row { display: flex; gap: 10px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #262a33; }
input[type="text"] { flex: 1; background: var(--panel-2); border: 1px solid #2b303b; color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; }
select { background: var(--panel-2); color: var(--text); border: 1px solid #2b303b; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; }
.deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.deck-card { background: var(--panel); border: 1px solid #262a33; border-radius: var(--radius); padding: 18px; cursor: pointer; }
.deck-card:hover { border-color: var(--accent); }
.deck-card h3 { margin: 0 0 8px; }
.deck-card .meta { color: var(--muted); font-size: 0.85rem; }
.deck-card .due-badge { display: inline-block; margin-top: 8px; background: var(--accent); color: #0f1115; font-weight: 600; border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; }
.actions-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.card-list { display: flex; flex-direction: column; gap: 8px; }
.card-row { display: flex; justify-content: space-between; align-items: center; background: var(--panel); border: 1px solid #262a33; border-radius: 8px; padding: 10px 14px; }
.card-row .front { font-weight: 600; }
.card-row .back { color: var(--muted); margin-left: 10px; }
.card-row button { padding: 4px 10px; font-size: 0.8rem; }
#studyProgress { text-align: center; color: var(--muted); margin-bottom: 14px; }

.study-settings-box { background: var(--panel); border: 1px solid #262a33; border-radius: var(--radius); padding: 18px; margin-bottom: 24px; }
.study-settings-box h3 { margin: 0 0 14px; font-size: 1.1rem; }
.settings-grid { display: flex; flex-direction: column; gap: 12px; }
.settings-grid label { cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 0.95rem; }
.settings-grid input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
.settings-hint { margin: 12px 0 0; font-size: 0.85rem; color: var(--muted); }

.flashcard { max-width: 500px; margin: 0 auto; min-height: 260px; perspective: 1000px; cursor: pointer; }
.flashcard-inner { position: relative; width: 100%; height: 260px; transition: transform 0.5s; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
.flashcard-inner.no-transition { transition: none; }
.flashcard-inner.flipped { transform: rotateY(180deg); }
.flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 1.6rem; font-weight: 600; border-radius: var(--radius); background: var(--panel); border: 1px solid #262a33; }
.flashcard-face.back { transform: rotateY(180deg); }
.pos-tag { position: absolute; top: 12px; left: 14px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); background: var(--panel-2); padding: 3px 8px; border-radius: 5px; }
.hint { text-align: center; color: var(--muted); margin-top: 14px; }

#interactiveArea { margin-top: 24px; text-align: center; }
.type-input-wrap { display: flex; gap: 10px; max-width: 400px; margin: 0 auto; }
.type-input-wrap input { flex: 1; text-align: center; font-size: 1.1rem; padding: 12px; font-weight: 600; background: var(--bg); }
.article-btns { display: flex; justify-content: center; gap: 14px; }
.article-btns button { font-size: 1.1rem; padding: 12px 24px; font-weight: 600; background: var(--bg); }
#feedbackBanner { text-align: center; margin-top: 16px; font-weight: 600; font-size: 1.1rem; padding: 10px; border-radius: 8px; background: var(--panel); border: 1px solid #262a33; max-width: 500px; margin-left: auto; margin-right: auto; }

.answer-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
.answer-buttons button { min-width: 90px; font-weight: 600; }
.q-again { border-color: var(--again); color: var(--again); }
.q-hard { border-color: var(--hard); color: var(--hard); }
.q-good { border-color: var(--good); color: var(--good); }
.q-easy { border-color: var(--easy); color: var(--easy); }
#studyDone { text-align: center; margin-top: 40px; color: var(--muted); }

.conjugate-wrap { max-width: 500px; margin: 16px auto 0; text-align: center; }
.conj-mini-table { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; text-align: left; }
.conj-mini-row { display: flex; justify-content: space-between; background: var(--panel); border: 1px solid #262a33; border-radius: 8px; padding: 8px 14px; }
.conj-mini-row .pronoun { color: var(--muted); font-weight: 600; }
.conj-meaning { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 1.05rem; }
.conj-table { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.conj-row { display: flex; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid #262a33; border-radius: 8px; padding: 12px 16px; cursor: pointer; }
.conj-row .pronoun { color: var(--muted); font-weight: 600; min-width: 90px; }
.conj-row .form { font-weight: 600; font-size: 1.05rem; filter: blur(6px); transition: filter 0.15s; user-select: none; }
.conj-row .form.revealed { filter: blur(0); user-select: text; }
.conj-row:hover .form { filter: blur(3px); }
.conj-row:hover .form.revealed { filter: blur(0); }
.breadcrumb { color: var(--muted); margin-bottom: 16px; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <h1 id="homeLink">📚 Flashcards</h1>
  <div class="header-actions">
    <button id="conjugationsNavBtn">🔤 Conjugări</button>
    <div id="backBtnWrap" class="hidden"><button id="backBtn">← Înapoi</button></div>
  </div>
</header>

<main>

  <section id="folderListView">
    <div class="backup-row">
      <button id="exportBtn" class="backup">💾 Descarcă memoria (Backup)</button>
      <input type="file" id="importFile" accept=".json" class="hidden" />
      <button id="importBtn" class="backup">📂 Încarcă memorie (Restore)</button>
    </div>
    <form id="newFolderForm" class="row">
      <input id="newFolderName" type="text" placeholder="Nume folder nou (ex: Franceză, Spaniolă)" required />
      <button type="submit" class="primary">+ Adaugă folder</button>
    </form>
    <div id="folderList" class="deck-grid"></div>
  </section>

  <section id="deckListView" class="hidden">
    <div class="breadcrumb" id="folderBreadcrumb"></div>
    <form id="newDeckForm" class="row">
      <input id="newDeckName" type="text" placeholder="Nume categorie nouă (ex: Verbe germane)" required />
      <button type="submit" class="primary">+ Adaugă categorie</button>
    </form>
    <div id="deckList" class="deck-grid"></div>
  </section>

  <section id="deckDetailView" class="hidden">
    <h2 id="deckTitle"></h2>

    <div class="study-settings-box">
      <h3>⚙️ Moduri de Studiu</h3>
      <div class="settings-grid">
        <label><input type="checkbox" id="optReverse"> 🔄 Mod Invers (Vezi traducerea, ghicești cuvântul original)</label>
        <label><input type="checkbox" id="optTyping"> ⌨️ Mod Scriere (Tastează răspunsul corect - ignoră automat diacriticele/semnele)</label>
        <label><input type="checkbox" id="optArticle"> 🎯 Ghicește Articolul (Alege der/die/das - se aplică doar substantivelor)</label>
      </div>
      <p class="settings-hint">Le poți folosi separat sau le poți combina. Setările se aplică doar pentru sesiunea curentă.</p>
    </div>

    <div class="actions-row">
      <button id="studyBtn" class="primary">▶ Studiază (<span id="dueCount">0</span> due)</button>
      <button id="studyAllBtn">▶ Studiază tot (toate cardurile)</button>
      <button id="renameDeckBtn">Redenumește categoria</button>
      <button id="deleteDeckBtn" class="danger">Șterge categoria</button>
    </div>

    <form id="newCardForm" class="row">
      <input id="newCardFront" type="text" placeholder="Față (ex: der Hund)" required />
      <input id="newCardBack" type="text" placeholder="Verso (ex: câinele)" required />
      <button type="submit" class="primary">+ Adaugă card</button>
    </form>

    <div id="cardList" class="card-list"></div>
  </section>

  <section id="studyView" class="hidden">
    <div id="studyProgress"></div>

    <div id="flashcard" class="flashcard">
      <div class="flashcard-inner" id="flashcardInner">
        <div class="flashcard-face front" id="cardFrontFace">
          <span class="pos-tag hidden" id="posTagFront"></span>
          <span id="cardFront"></span>
        </div>
        <div class="flashcard-face back" id="cardBackFace">
          <span class="pos-tag hidden" id="posTagBack"></span>
          <span id="cardBack"></span>
        </div>
      </div>
    </div>

    <p class="hint" id="studyHint">Click pe card ca să vezi răspunsul</p>

    <div id="interactiveArea" class="hidden"></div>
    <div id="feedbackBanner" class="hidden"></div>

    <div id="conjugateWrap" class="conjugate-wrap hidden">
      <button id="conjugateCardBtn">🔤 Conjugă verbul</button>
      <div id="conjugateCardTable" class="conj-mini-table hidden"></div>
    </div>

    <div id="answerButtons" class="answer-buttons hidden">
      <button data-q="0" class="q-again">Din nou</button>
      <button data-q="1" class="q-hard">Greu</button>
      <button data-q="2" class="q-good">Bine</button>
      <button data-q="3" class="q-easy">Ușor</button>
    </div>

    <div id="studyDone" class="hidden">
      <p>🎉 Gata! Nu mai ai carduri de revizuit acum în această categorie.</p>
    </div>
  </section>

  <section id="conjugationsView" class="hidden">
    <div class="row">
      <select id="verbSelect"></select>
      <button id="showAllBtn">Arată tot</button>
      <button id="hideAllBtn">Ascunde tot</button>
    </div>
    <div id="conjugationMeaning" class="conj-meaning"></div>
    <div id="conjugationTable" class="conj-table"></div>
  </section>

</main>

const STORAGE_KEY = 'flashcards_data_v1';
const SEED_FLAG_KEY = 'flashcards_seeded_v1';
const SEED_FLAG_KEY_2 = 'flashcards_seeded_v2';
const SEED_FLAG_KEY_3 = 'flashcards_seeded_v3';
const SEED_FLAG_KEY_NOTION = 'flashcards_seeded_notion_v1';
const SEED_FLAG_KEY_RO = 'flashcards_seeded_ro_v1';
const SEED_FLAG_KEY_VERBE = 'flashcards_seeded_v4';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function buildConjugationFlashcards() {
  const cards = [];
  Object.keys(VERB_CONJUGATIONS).forEach(verb => {
    const forms = VERB_CONJUGATIONS[verb];
    const meaning = VERB_MEANINGS[verb] || '';
    PRONOUNS.forEach((pronoun, i) => {
      cards.push([`${verb} (${meaning}) — ${pronoun}`, forms[i]]);
    });
  });
  return cards;
}

function dedupeDecks(data) {
  const seenByKey = {};
  const merged = [];
  let didMerge = false;
  data.decks.forEach(d => {
    const key = d.folder + '|||' + d.name;
    if (seenByKey[key]) {
      didMerge = true;
      const target = seenByKey[key];
      d.cards.forEach(c => {
        const existing = target.cards.find(tc => tc.front.trim().toLowerCase() === c.front.trim().toLowerCase());
        if (!existing) {
          target.cards.push(c);
        } else if ((c.repetitions || 0) > (existing.repetitions || 0)) {
          Object.assign(existing, c, { id: existing.id });
        }
      });
    } else {
      seenByKey[key] = d;
      merged.push(d);
    }
  });
  if (didMerge) data.decks = merged;
  return didMerge;
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  let data = raw ? (JSON.parse(raw) || { decks: [], folders: [] }) : { decks: [], folders: [] };
  if (!data.folders) data.folders = [];
  data.decks.forEach(d => { if (!d.folder) d.folder = 'Germană'; });

  const didDedupe = dedupeDecks(data);

  function addDeckOnce(flagKey, folder, name, wordList) {
    if (localStorage.getItem(flagKey)) {
      const deck = data.decks.find(d => d.name === name && d.folder === folder);
      if (deck) {
        let changed = false;
        wordList.forEach(([f, b]) => {
          const card = deck.cards.find(c => c.front.toLowerCase() === f.toLowerCase());
          if (!card) {
            deck.cards.push({ id: uid(), front: f, back: b, ef: 2.5, interval: 0, repetitions: 0, due: Date.now() });
            changed = true;
          } else if (card.back !== b) {
            card.back = b;
            changed = true;
          }
        });
        if (changed) saveData(data);
      }
      return;
    }
    if (!data.folders.includes(folder)) data.folders.push(folder);
    data.decks.push({
      id: uid(), name, folder,
      cards: wordList.map(([front, back]) => ({
        id: uid(), front, back, ef: 2.5, interval: 0, repetitions: 0, due: Date.now()
      }))
    });
    localStorage.setItem(flagKey, '1');
  }

  addDeckOnce(SEED_FLAG_KEY, 'Germană', 'Cuvinte inițiale', SEED_WORDS);
  addDeckOnce(SEED_FLAG_KEY_2, 'Germană', 'A2/B1 - cuvinte de bază', SEED_WORDS_2);
  addDeckOnce(SEED_FLAG_KEY_3, 'Germană', 'A1 - fundații (pronume, numere, zile, luni, prepoziții)', SEED_WORDS_3);
  addDeckOnce(SEED_FLAG_KEY_NOTION, 'Germană', 'Cuvinte Notion', SEED_WORDS_NOTION);
  addDeckOnce(SEED_FLAG_KEY_VERBE, 'Germană', 'Verbe - conjugare (flashcards)', buildConjugationFlashcards());
  addDeckOnce(SEED_FLAG_KEY_RO, 'Vocabular avansat românesc', 'Cuvinte rare / neologisme', SEED_WORDS_RO);

  if (didDedupe) saveData(data);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

document.getElementById('exportBtn').onclick = () => {
  const data = localStorage.getItem(STORAGE_KEY);
  if (!data) return alert('Nu există date de salvat!');
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `flashcards_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!confirm('Aceasta va înlocui TOATE datele curente din aplicație cu cele din fișierul încărcat. Continui?')) {
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const jsonStr = ev.target.result;
      const parsed = JSON.parse(jsonStr);
      if (parsed && parsed.decks && parsed.folders) {
        localStorage.setItem(STORAGE_KEY, jsonStr);
        alert('Datele au fost încărcate cu succes!');
        location.reload();
      } else alert('Fișier invalid.');
    } catch(err) { alert('Eroare la citire.'); }
  };
  reader.readAsText(file);
};

function getVerbKey(front) {
  let f = front.trim().toLowerCase();
  f = f.split('(')[0].trim();
  if (VERB_CONJUGATIONS[f]) return f;
  return null;
}
function detectPOS(front) {
  const f = front.trim();
  if (/^(der|die|das)\s/i.test(f)) return 'substantiv';
  if (getVerbKey(f)) return 'verb';
  if (/\?$/.test(f) || f.split(' ').length > 3) return 'frază';
  if (f.split(' ').length > 1) return 'expresie';
  return 'adj. / adv.';
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getCleanTarget(str) {
  return str.toLowerCase()
    .replace(/\(.*?\)/g, '')
    .replace(/[ä]/g, 'a').replace(/[ö]/g, 'o').replace(/[ü]/g, 'u').replace(/[ß]/g, 'ss')
    .replace(/[^a-z0-9]/g, '');
}
function compareTyping(input, target) {
  return getCleanTarget(input) === getCleanTarget(target) && getCleanTarget(input) !== '';
}
function getVisibleTarget(str) {
  return str.replace(/\(.*?\)/g, '').trim();
}

let currentFolder = null;
let currentDeckId = null;
let studyQueue = [];
let studyIndex = 0;
let flipped = false;
let backAction = () => {};

let modeReverse = false;
let modeTyping = false;
let modeArticle = false;
let currentTargetAnswer = "";

const folderListView = document.getElementById('folderListView');
const deckListView = document.getElementById('deckListView');
const deckDetailView = document.getElementById('deckDetailView');
const studyView = document.getElementById('studyView');
const conjugationsView = document.getElementById('conjugationsView');
const backBtnWrap = document.getElementById('backBtnWrap');

function showView(view) {
  [folderListView, deckListView, deckDetailView, studyView, conjugationsView].forEach(v => v.classList.add('hidden'));
  view.classList.remove('hidden');
}

function goFolders() { currentFolder = null; currentDeckId = null; showView(folderListView); backBtnWrap.classList.add('hidden'); renderFolderList(); }
function goFolderDecks(folder) { currentFolder = folder; currentDeckId = null; showView(deckListView); backBtnWrap.classList.remove('hidden'); backAction = goFolders; document.getElementById('folderBreadcrumb').textContent = folder; renderDeckList(); }
function goDeckDetail(id) { currentDeckId = id; showView(deckDetailView); backBtnWrap.classList.remove('hidden'); backAction = () => goFolderDecks(currentFolder); document.getElementById('deckTitle').textContent = getDeck(id).name; renderCardList(); }

document.getElementById('homeLink').onclick = goFolders;
document.getElementById('backBtn').onclick = () => backAction();

function renderFolderList() {
  const data = loadData();
  const el = document.getElementById('folderList'); el.innerHTML = '';
  const folders = data.folders.length ? data.folders : Array.from(new Set(data.decks.map(d => d.folder)));
  folders.forEach(folder => {
    const decks = data.decks.filter(d => d.folder === folder);
    const cardCount = decks.reduce((s, d) => s + d.cards.length, 0);
    const dueCount = decks.reduce((s, d) => s + d.cards.filter(c => (c.due || 0) <= Date.now()).length, 0);
    const card = document.createElement('div'); card.className = 'deck-card';
    card.innerHTML = `<h3>📁 ${escapeHtml(folder)}</h3><div class="meta">${decks.length} categorii · ${cardCount} carduri</div>${dueCount > 0 ? `<div class="due-badge">${dueCount} de revizuit</div>` : ''}`;
    card.onclick = () => goFolderDecks(folder); el.appendChild(card);
  });
}

document.getElementById('newFolderForm').onsubmit = (e) => { e.preventDefault(); const input = document.getElementById('newFolderName'); const name = input.value.trim(); if (!name) return; const data = loadData(); if (!data.folders.includes(name)) data.folders.push(name); saveData(data); input.value = ''; renderFolderList(); };

function getDeck(id) { return loadData().decks.find(d => d.id === id); }

function renderDeckList() {
  const data = loadData();
  const decks = data.decks.filter(d => d.folder === currentFolder);
  const el = document.getElementById('deckList'); el.innerHTML = '';
  decks.forEach(d => {
    const dueCount = d.cards.filter(c => (c.due || 0) <= Date.now()).length;
    const card = document.createElement('div'); card.className = 'deck-card';
    card.innerHTML = `<h3>${escapeHtml(d.name)}</h3><div class="meta">${d.cards.length} carduri</div>${dueCount > 0 ? `<div class="due-badge">${dueCount} de revizuit</div>` : ''}`;
    card.onclick = () => goDeckDetail(d.id); el.appendChild(card);
  });
}

document.getElementById('newDeckForm').onsubmit = (e) => { e.preventDefault(); const input = document.getElementById('newDeckName'); const name = input.value.trim(); if (!name) return; const data = loadData(); data.decks.push({ id: uid(), name, folder: currentFolder, cards: [] }); saveData(data); input.value = ''; renderDeckList(); };

function renderCardList() {
  const deck = getDeck(currentDeckId);
  document.getElementById('dueCount').textContent = deck.cards.filter(c => (c.due || 0) <= Date.now()).length;
  const el = document.getElementById('cardList'); el.innerHTML = '';
  deck.cards.forEach(c => {
    const row = document.createElement('div'); row.className = 'card-row';
    row.innerHTML = `<div><span class="front">${escapeHtml(c.front)}</span><span class="back">${escapeHtml(c.back)}</span></div><button data-id="${c.id}">Șterge</button>`;
    row.querySelector('button').onclick = () => { const data = loadData(); const d = data.decks.find(dd => dd.id === currentDeckId); d.cards = d.cards.filter(cc => cc.id !== c.id); saveData(data); renderCardList(); };
    el.appendChild(row);
  });
}

document.getElementById('newCardForm').onsubmit = (e) => { e.preventDefault(); const f = document.getElementById('newCardFront'); const b = document.getElementById('newCardBack'); if (!f.value.trim() || !b.value.trim()) return; const data = loadData(); const d = data.decks.find(dd => dd.id === currentDeckId); d.cards.push({ id: uid(), front: f.value.trim(), back: b.value.trim(), ef: 2.5, interval: 0, repetitions: 0, due: Date.now() }); saveData(data); f.value = ''; b.value = ''; f.focus(); renderCardList(); };
document.getElementById('renameDeckBtn').onclick = () => { const deck = getDeck(currentDeckId); const name = prompt('Nume nou:', deck.name); if (!name || !name.trim()) return; const data = loadData(); data.decks.find(d => d.id === currentDeckId).name = name.trim(); saveData(data); document.getElementById('deckTitle').textContent = name.trim(); };
document.getElementById('deleteDeckBtn').onclick = () => { if (!confirm(`Ștergi categoria?`)) return; const data = loadData(); data.decks = data.decks.filter(d => d.id !== currentDeckId); saveData(data); goFolderDecks(currentFolder); };

document.getElementById('studyBtn').onclick = () => { initStudy(true); };
document.getElementById('studyAllBtn').onclick = () => { initStudy(false); };

function initStudy(onlyDue) {
  const deck = getDeck(currentDeckId);
  studyQueue = onlyDue ? deck.cards.filter(c => (c.due || 0) <= Date.now()) : deck.cards.slice();
  for (let i = studyQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [studyQueue[i], studyQueue[j]] = [studyQueue[j], studyQueue[i]]; }
  studyIndex = 0;

  modeReverse = document.getElementById('optReverse').checked;
  modeTyping = document.getElementById('optTyping').checked;
  modeArticle = document.getElementById('optArticle').checked;

  showView(studyView);
  backBtnWrap.classList.remove('hidden'); backAction = () => goDeckDetail(currentDeckId);
  document.getElementById('studyDone').classList.add('hidden');
  document.getElementById('flashcard').classList.remove('hidden');
  renderStudyCard();
}

function flipCard() {
  if (flipped) return;
  flipped = true;
  document.getElementById('flashcardInner').classList.add('flipped');
  document.getElementById('answerButtons').classList.remove('hidden');
  document.getElementById('studyHint').classList.add('hidden');

  let inp = document.getElementById('typeInput');
  if(inp) inp.disabled = true;
}

document.getElementById('flashcard').onclick = () => {
  if(!flipped) {
      document.getElementById('feedbackBanner').classList.add('hidden');
      flipCard();
  }
};

window.triggerTypingCheck = function() {
  if(flipped) return;
  let val = document.getElementById('typeInput').value;
  let isCorrect = compareTyping(val, currentTargetAnswer);

  let banner = document.getElementById('feedbackBanner');
  banner.classList.remove('hidden');
  if (isCorrect) {
    banner.innerHTML = `<span style="color:var(--good)">✅ Corect!</span>`;
  } else {
    banner.innerHTML = `<span style="color:var(--again)">❌ Ai scris: <strong>${escapeHtml(val || "(gol)")}</strong> (Corect: ${escapeHtml(getVisibleTarget(currentTargetAnswer))})</span>`;
  }
  flipCard();
};

window.triggerArticleCheck = function(guessed, correct) {
  if(flipped) return;
  let isCorrect = (guessed === correct);
  let banner = document.getElementById('feedbackBanner');
  banner.classList.remove('hidden');
  if(isCorrect) {
      banner.innerHTML = `<span style="color:var(--good)">✅ Corect (${correct})</span>`;
  } else {
      banner.innerHTML = `<span style="color:var(--again)">❌ Ai ales: <strong>${guessed}</strong>. Corect era: ${correct}</span>`;
  }
  flipCard();
};

function renderStudyCard() {
  if (studyIndex >= studyQueue.length) {
    document.getElementById('flashcard').classList.add('hidden');
    document.getElementById('answerButtons').classList.add('hidden');
    document.getElementById('conjugateWrap').classList.add('hidden');
    document.getElementById('interactiveArea').classList.add('hidden');
    document.getElementById('feedbackBanner').classList.add('hidden');
    document.getElementById('studyHint').classList.add('hidden');
    document.getElementById('studyProgress').textContent = '';
    document.getElementById('studyDone').classList.remove('hidden');
    return;
  }
  flipped = false;
  const c = studyQueue[studyIndex];
  const inner = document.getElementById('flashcardInner');
  inner.classList.add('no-transition'); inner.classList.remove('flipped');
  document.getElementById('answerButtons').classList.add('hidden');
  document.getElementById('feedbackBanner').classList.add('hidden');
  document.getElementById('studyProgress').textContent = `${studyIndex + 1} / ${studyQueue.length}`;

  let displayFront = c.front;
  let displayBack = c.back;
  currentTargetAnswer = c.back;

  const pos = detectPOS(c.front);
  const posFront = document.getElementById('posTagFront');
  const posBack = document.getElementById('posTagBack');
  posFront.textContent = pos; posBack.textContent = pos;
  posFront.classList.remove('hidden'); posBack.classList.remove('hidden');

  let isNounMatch = /^(der|die|das)\s+(.+)$/i.exec(c.front);
  let usesArticleMode = false;
  let nounArticle = "";

  if (modeReverse) {
      displayFront = c.back;
      displayBack = c.front;
      currentTargetAnswer = c.front;
  } else if (modeArticle && isNounMatch) {
      nounArticle = isNounMatch[1].toLowerCase();
      displayFront = "___ " + isNounMatch[2];
      displayBack = c.front;
      currentTargetAnswer = nounArticle;
      usesArticleMode = true;
  }

  document.getElementById('cardFront').textContent = displayFront;
  document.getElementById('cardBack').textContent = displayBack;

  let interactiveArea = document.getElementById('interactiveArea');
  interactiveArea.innerHTML = '';
  interactiveArea.classList.remove('hidden');

  let hintText = document.getElementById('studyHint');
  hintText.classList.remove('hidden');

  if (usesArticleMode && !modeTyping) {
      hintText.textContent = "Alege articolul corect (sau click pe card pt răspuns)";
      interactiveArea.innerHTML = `
          <div class="article-btns">
              <button onclick="event.stopPropagation(); triggerArticleCheck('der', '${nounArticle}')">der</button>
              <button onclick="event.stopPropagation(); triggerArticleCheck('die', '${nounArticle}')">die</button>
              <button onclick="event.stopPropagation(); triggerArticleCheck('das', '${nounArticle}')">das</button>
          </div>
      `;
  } else if (modeTyping) {
      hintText.textContent = "Tastează răspunsul și apasă Enter";
      interactiveArea.innerHTML = `
          <div class="type-input-wrap">
              <input type="text" id="typeInput" placeholder="..." autocomplete="off" onclick="event.stopPropagation()" />
              <button onclick="event.stopPropagation(); triggerTypingCheck()">Verifică</button>
          </div>
      `;
      setTimeout(() => {
          let inp = document.getElementById('typeInput');
          if(inp) {
              inp.focus();
              inp.onkeypress = (e) => { if(e.key === 'Enter') triggerTypingCheck(); }
          }
      }, 50);
  } else {
      interactiveArea.classList.add('hidden');
      hintText.textContent = "Click pe card ca să vezi răspunsul";
  }

  const verbKey = getVerbKey(c.front);
  const conjWrap = document.getElementById('conjugateWrap');
  const conjTable = document.getElementById('conjugateCardTable');
  conjTable.classList.add('hidden'); conjTable.innerHTML = '';
  if (verbKey) {
    conjWrap.classList.remove('hidden');
    document.getElementById('conjugateCardBtn').onclick = (ev) => {
      ev.stopPropagation();
      const forms = VERB_CONJUGATIONS[verbKey];
      conjTable.innerHTML = PRONOUNS.map((p, i) => `<div class="conj-mini-row"><span class="pronoun">${p}</span><span>${forms[i]}</span></div>`).join('');
      conjTable.classList.toggle('hidden');
    };
  } else conjWrap.classList.add('hidden');

  requestAnimationFrame(() => requestAnimationFrame(() => inner.classList.remove('no-transition')));
}

document.getElementById('answerButtons').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-q]');
  if (!btn) return;
  const quality = parseInt(btn.dataset.q, 10);
  const c = studyQueue[studyIndex];
  const data = loadData();
  const d = data.decks.find(dd => dd.id === currentDeckId);
  const cardInData = d.cards.find(cc => cc.id === c.id);
  Object.assign(cardInData, schedule(cardInData, quality));
  saveData(data);
  studyIndex++;
  renderStudyCard();
});

function schedule(card, quality) {
  let { ef = 2.5, interval = 0, repetitions = 0 } = card;
  if (quality === 0) { repetitions = 0; interval = 1 / 288; }
  else {
    const q = { 1: 3, 2: 4, 3: 5 }[quality];
    ef = ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    if (ef < 1.3) ef = 1.3;
    repetitions += 1;
    if (repetitions === 1) interval = 1; else if (repetitions === 2) interval = 6; else interval = Math.round(interval * ef);
    if (quality === 1) interval = Math.max(1, Math.round(interval * 0.5));
    if (quality === 3) interval = Math.round(interval * 1.3);
  }
  return { ef, interval, repetitions, due: Date.now() + interval * 24 * 60 * 60 * 1000 };
}

const verbSelect = document.getElementById('verbSelect');
Object.keys(VERB_CONJUGATIONS).forEach(verb => {
  const opt = document.createElement('option'); opt.value = verb; opt.textContent = `${verb} (${VERB_MEANINGS[verb] || ''})`; verbSelect.appendChild(opt);
});
document.getElementById('conjugationsNavBtn').onclick = () => { showView(conjugationsView); backBtnWrap.classList.remove('hidden'); backAction = goFolders; renderConjugationTable(); };
verbSelect.onchange = renderConjugationTable;

function renderConjugationTable() {
  const verb = verbSelect.value || Object.keys(VERB_CONJUGATIONS)[0];
  verbSelect.value = verb;
  const forms = VERB_CONJUGATIONS[verb];
  document.getElementById('conjugationMeaning').textContent = `${verb} — ${VERB_MEANINGS[verb] || ''}`;
  const el = document.getElementById('conjugationTable'); el.innerHTML = '';
  PRONOUNS.forEach((pronoun, i) => {
    const row = document.createElement('div'); row.className = 'conj-row';
    row.innerHTML = `<span class="pronoun">${pronoun}</span><span class="form">${forms[i]}</span>`;
    row.onclick = () => row.querySelector('.form').classList.toggle('revealed');
    el.appendChild(row);
  });
}
document.getElementById('showAllBtn').onclick = () => { document.querySelectorAll('#conjugationTable .form').forEach(f => f.classList.add('revealed')); };
document.getElementById('hideAllBtn').onclick = () => { document.querySelectorAll('#conjugationTable .form').forEach(f => f.classList.remove('revealed')); };

goFolders();
</script>
